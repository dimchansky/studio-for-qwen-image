<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="studio-token" content="__STUDIO_TOKEN__"><title>Qwen Studio</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app">
<aside id="sidebar"><div class="sidebar-top"><button class="icon-button" id="collapse" aria-label="收起侧栏" data-icon="panel"></button></div>
<nav><button id="new-session" class="nav-item selected"><i data-icon="plus"></i><span>新会话</span><kbd>⌘ N</kbd></button><button id="search-button" class="nav-item"><i data-icon="search"></i><span>搜索会话</span><kbd>⌘ K</kbd></button><button id="gallery-button" class="nav-item"><i data-icon="image"></i><span>图片库</span></button></nav>
<div class="history-heading">最近会话</div><input type="search" id="search" placeholder="搜索会话名称…" aria-label="搜索会话" hidden><div id="sessions" class="sessions"></div>
<div class="sidebar-bottom"><button id="settings-button" class="nav-item"><i data-icon="sliders"></i><span>模型设置</span></button><div class="brand-footer"><span class="brand-symbol" aria-hidden="true">q.</span><span>Qwen Studio</span></div></div></aside>
<main><header><button id="expand" class="icon-button" aria-label="展开侧栏" data-icon="panel" hidden></button><span id="thread-title">新会话</span><div class="header-right"><button id="model-status" class="status-button"><span class="status-dot amber"></span><span>正在检查模型</span></button><button id="session-menu" class="icon-button" aria-label="会话选项" data-icon="more" hidden></button></div></header>
<section id="workspace" class="workspace empty"><div id="welcome" class="welcome"><h1 id="welcome-line">今天，想创作些什么？</h1></div><div id="messages" class="messages" aria-live="polite"></div>
<div id="composer-area"><div id="task-tray" hidden><div class="task-tray-clip"><div class="task-tray-content"><div id="running-task"></div><div id="queued-tasks"></div></div></div></div><form id="composer"><div class="mode-row"><div class="segmented" role="group" aria-label="创作模式"><button type="button" data-mode="image" class="active"><i data-icon="image"></i>图像</button><button type="button" data-mode="chat"><i data-icon="chat"></i>对话</button></div><span id="model-label" hidden>Qwen-Image-2.1</span></div><div id="attachments"></div><textarea id="prompt" rows="3" placeholder="描述你想看见的画面…" aria-label="消息内容"></textarea><div class="composer-toolbar"><div class="toolbar-left"><button type="button" id="attach" class="icon-button" aria-label="创作工具" aria-haspopup="menu" aria-expanded="false" title="创作工具" data-icon="plus"></button><button type="button" id="options-button" class="text-button"><i data-icon="sliders"></i><span id="options-label">768 × 768</span></button><label id="transparent-label" class="transparency"><input type="checkbox" id="transparent">透明背景</label></div><div class="toolbar-right"><div id="model-controls" class="model-pill" hidden><button type="button" id="model-picker-button" aria-haspopup="menu" aria-expanded="false"><i data-icon="model"></i><span id="selected-model">选择模型</span></button><button type="button" id="thinking-picker-button" aria-label="思考强度" aria-haspopup="menu" aria-expanded="false"><span class="effort-icon" aria-hidden="true">💪</span><span id="selected-thinking">标准</span><i data-icon="chevron"></i></button><div id="model-popover" class="picker-popover" role="menu" hidden><div class="picker-heading">选择模型</div><div id="model-options"></div></div><div id="thinking-popover" class="picker-popover" role="menu" hidden><div class="picker-heading">思考强度</div><div id="thinking-options"></div></div></div><button id="send" class="send-button" type="submit" aria-label="发送" disabled data-icon="arrow"></button></div></div></form>
<div class="composer-foot"><span>⌘ ↵</span></div></div></section>
<section id="gallery" hidden><div class="section-heading"><div><h1>图片库</h1></div><button id="back" class="text-button">返回会话<i data-icon="arrow-right"></i></button></div><div id="gallery-grid"></div></section>
<section id="settings" class="settings-page" hidden><div class="dialog-heading"><h1>模型设置</h1><button id="close-settings" class="icon-button" aria-label="返回会话" data-icon="close"></button></div><div class="setting-block"><div class="setting-title"><strong>Qwen-Image-2.1</strong></div><p id="download-info">正在读取模型状态…</p><progress id="download-progress" max="1" value="0"></progress><div class="download-metrics"><span id="download-speed">正在测量速度…</span><span id="download-eta">剩余时间待估算</span></div><label class="setting-row download-source-row" for="download-source"><span>下载源</span><select id="download-source"><option value="">首次下载时选择</option></select></label><p id="download-source-note" class="muted small">选择适合当前网络的下载源。</p><button id="download" class="primary-button">下载模型</button><p id="download-error" class="error-text" hidden></p></div><div class="setting-block"><div class="setting-title"><strong>Ollama</strong><span id="ollama-state" class="tag">检查中</span></div></div><div class="setting-block appearance-settings"><div class="setting-title"><strong>首页</strong></div><label class="setting-row" for="welcome-language"><span>引导语语言</span><select id="welcome-language"><option value="auto">跟随系统</option><option value="zh">简体中文</option><option value="en">English</option></select></label><label class="setting-row" for="welcome-cycle"><span>引导语轮换</span><span class="transparency"><input id="welcome-cycle" type="checkbox" checked></span></label></div><div class="setting-block"><strong>本地文件</strong><p id="data-path" class="path"></p><button id="reveal-data" class="text-button"><i data-icon="folder"></i>在 Finder 中打开</button></div></section>
</main></div>
<dialog id="download-source-dialog" aria-labelledby="download-source-title"><form id="download-source-form"><div class="dialog-heading"><h2 id="download-source-title">选择下载源</h2><button type="button" class="icon-button close-dialog" aria-label="暂不下载" data-icon="close"></button></div><p class="muted">两种来源提供同一模型。选择会被记住，之后可在模型设置中更改。</p><div id="download-source-options"></div><p id="source-choice-error" class="error-text" hidden></p><div class="dialog-actions"><button type="button" class="text-button close-dialog">稍后再说</button><button id="confirm-download" type="submit" class="primary-button" disabled>开始下载</button></div></form></dialog>
<dialog id="options"><div class="dialog-heading"><h2>图像参数</h2><button class="icon-button close-dialog" aria-label="关闭参数" data-icon="close"></button></div><label class="field">图片尺寸<select id="size"><option value="512,512">512 × 512</option><option value="768,768" selected>768 × 768</option><option value="1024,1024">1024 × 1024</option><option value="1024,768">1024 × 768</option><option value="768,1024">768 × 1024</option><option value="1344,768">1344 × 768</option><option value="1536,1536">1536 × 1536</option><optgroup label="2K"><option value="2048,2048">2048 × 2048（1:1）</option><option value="2400,1792">2400 × 1792（4:3）</option><option value="1792,2400">1792 × 2400（3:4）</option><option value="2528,1696">2528 × 1696（3:2）</option><option value="1696,2528">1696 × 2528（2:3）</option><option value="2752,1536">2752 × 1536（16:9）</option><option value="1536,2752">1536 × 2752（9:16）</option></optgroup></select></label><label class="field">生成步数 <span class="muted small">40 步适合正式出图，较少步数用于预览。</span><input id="steps" type="number" min="1" max="60" value="40"></label><label class="field">随机种子 <span class="muted small">-1 表示随机，相同种子方便比较修改。</span><input id="seed" type="number" min="-1" max="4294967295" value="-1"></label><button id="apply-options" class="primary-button">完成</button></dialog>
<dialog id="session-options"><div class="dialog-heading"><h2>管理会话</h2><button class="icon-button close-dialog" aria-label="关闭" data-icon="close"></button></div><label class="field">会话名称<input id="rename-input" maxlength="80"></label><div class="dialog-actions"><button id="delete-session" class="danger-button">删除会话</button><button id="rename-session" class="primary-button">保存名称</button></div><p class="muted small">删除会话会移除聊天记录，已保存的图片文件仍保留在本地。</p></dialog>
<div id="creation-menu" popover="manual" role="menu" aria-label="创作工具"></div><dialog id="image-viewer" aria-label="图片预览"><div class="viewer-toolbar"><span>图片预览</span><button id="viewer-zoom" class="text-button">原始尺寸</button><button id="viewer-save" class="text-button">保存图片</button><button class="icon-button close-dialog" aria-label="关闭图片预览" data-icon="close"></button></div><div class="viewer-canvas"><img id="viewer-image" alt="图片完整预览"></div></dialog><div id="toast" role="status" hidden></div><input id="file-input" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden><script src="app.js"></script></body></html>
