name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r macos/requirements.txt
      - name: Unit tests (no model weights needed)
        run: python -m unittest discover -s macos/tests -p 'test_*.py' -v
      - name: Localization
        run: |
          python scripts/build_locales.py
          git diff --exit-code macos/web/locale-data.js
          python -m unittest discover -s tests -v
          node tests/i18n.test.cjs
      - name: Syntax
        run: |
          for file in macos/web/*.js; do node --check "$file"; done
          for script in setup.sh run.sh download.sh scripts/spikes/batch1.sh; do zsh -n "$script"; done
