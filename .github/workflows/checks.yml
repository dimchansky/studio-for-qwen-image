name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r macos/requirements.txt
      - name: Unit tests (no model weights needed)
        run: python -m unittest discover -s macos/tests -p 'test_*.py' -v
      - name: Localization
        run: |
          python scripts/build_locales.py
          git diff --exit-code macos/web/locale-data.js
          python -m unittest discover -s tests -v
          node tests/i18n.test.cjs
      - name: Syntax
        run: |
          for file in macos/web/*.js; do node --check "$file"; done
          for script in setup.sh run.sh download.sh scripts/spikes/batch1.sh; do zsh -n "$script"; done
