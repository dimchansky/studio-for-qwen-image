name: Bug report
description: Report a reproducible problem
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: Mac and software
      description: Mac model, chip, memory (GB), macOS version, Python version, free disk space.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected result
      description: Include the mode (Turbo / Standard / Quality), size, number of references and whether the prompt enhancer was on.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error, log excerpt or screenshot
      description: The end of `data/jobs/<id>.log` and Settings → Environment check. Remove private prompts, images, paths and tokens.
